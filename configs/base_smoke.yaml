run:
  name: base-smoke
  seed: 1337
  device: cuda
  output_dir: runs

tracking:
  wandb:
    enabled: false
    project: gpt-training-sandbox
    entity: null
    mode: online
    log_code: false
    log_model_artifacts: false
    log_dataset_artifacts: false
    log_tokenizer_artifacts: false
    log_prompts: false
    log_responses: false

data:
  profile: nanochat_climbmix
  base_dir: data
  parquet_dir: data/parquet/base_data_climbmix
  tokenized_dir: data/tokenized
  loader_strategy: packed
  num_pretrain_train_shards: 16
  always_use_final_shard_for_val: true

tokenizer:
  type: regex_byte_bpe
  vocab_size: 32768
  artifact_dir: runs/tokenizer-32k/artifacts/tokenizer

model:
  profile: simple_gpt
  vocab_size: 32768
  seq_len: 128
  n_layer: 2
  n_head: 2
  n_embd: 128
  mlp_ratio: 4
  dropout: 0.0
  bias: false
  tie_weights: true
  norm: layernorm
  activation: gelu
  use_rope: false
  use_rmsnorm: false
  use_qk_norm: false
  use_gqa: false
  attention_backend: manual
  attention_fallback_policy: allow
  flash_attention_provider: auto
  use_flash_attention: false
  use_kv_cache: false

train:
  device_batch_size: 4
  total_batch_size_tokens: 8192
  grad_accum_steps: auto
  max_steps: 500
  learning_rate: 0.0003
  min_lr: 0.000015
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  warmup_steps: 40
  warmdown_ratio: 0.65
  final_lr_frac: 0.05
  eval_every: 50
  eval_tokens: 1048576
  sample_every: 100
  save_every: 100
  log_every: 10
  mfu_peak_flops_per_second: 35580000000000
  mfu_peak_flops_basis: NVIDIA GeForce RTX 3090 advertised FP32 peak (35.58 TFLOP/s)
  dtype: float32
  compile: false
  compile_backend: inductor
  compile_mode: default
  compile_fallback_policy: eager
  compile_fullgraph: false
  compile_dynamic: false
  activation_checkpointing: false

generation:
  temperature: 0.8
  top_k: 50
  top_p: null
  max_new_tokens: 256
  seed: null

web:
  enabled: false
