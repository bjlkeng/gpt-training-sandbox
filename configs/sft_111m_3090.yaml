run:
  name: sft-111m-base30k-3090
  seed: 1337
  device: cuda
  output_dir: runs

tracking:
  wandb:
    enabled: true
    project: gpt-training-sandbox
    entity: null
    group: 111m-3090-base-to-sft
    name: null
    tags: [sft, 111m, 3090]
    mode: online
    dir: runs/wandb
    log_code: false
    log_model_artifacts: false
    log_dataset_artifacts: false
    log_tokenizer_artifacts: false
    log_prompts: false
    log_responses: false

data:
  profile: nanochat_climbmix
  base_dir: data
  parquet_dir: data/parquet/base_data_climbmix
  tokenized_dir: data/tokenized_37
  loader_strategy: packed
  num_pretrain_train_shards: 37
  always_use_final_shard_for_val: true

tokenizer:
  type: regex_byte_bpe
  vocab_size: 32768
  artifact_dir: runs/tokenizer-32k/artifacts/tokenizer

model:
  profile: simple_gpt
  vocab_size: 32768
  seq_len: 1024
  n_layer: 12
  n_head: 12
  n_kv_head: 12
  n_embd: 768
  mlp_ratio: 4
  dropout: 0.0
  bias: false
  tie_weights: true
  norm: layernorm
  activation: gelu
  use_rope: false
  rope_theta: 10000.0
  use_rmsnorm: false
  use_qk_norm: false
  use_gqa: false
  attention_backend: manual
  attention_fallback_policy: allow
  flash_attention_provider: auto
  use_flash_attention: false
  use_kv_cache: false

# eval_base reads its BPB protocol shape from train, including for SFT checkpoints.
train:
  device_batch_size: 8
  eval_tokens: 1048576

sft:
  base_checkpoint: null
  train_sources:
    - kind: hub_cache
      path: data/parquet/sft
      dataset: smoltalk
      split: train
      repeat_weight: 1
      shuffle: true
    - kind: hub_cache
      path: data/parquet/sft
      dataset: mmlu
      split: auxiliary_train
      repeat_weight: 3
      shuffle: true
    - kind: hub_cache
      path: data/parquet/sft
      dataset: gsm8k
      split: train
      repeat_weight: 4
      shuffle: true
  validation_sources:
    - kind: hub_cache
      path: data/parquet/sft
      dataset: smoltalk
      split: test
      repeat_weight: 1
      shuffle: false
    - kind: hub_cache
      path: data/parquet/sft
      dataset: mmlu
      split: test
      repeat_weight: 1
      shuffle: false
    - kind: hub_cache
      path: data/parquet/sft
      dataset: gsm8k
      split: test
      repeat_weight: 1
      shuffle: false
  packing_buffer_size: 100
  shuffle_buffer_size: 1024
  row_batch_size: 1024
  device_batch_size: 8
  total_batch_size_tokens: 32768
  grad_accum_steps: auto
  max_steps: 2000
  learning_rate: 0.00001
  min_lr: 0.0
  weight_decay: 0.0
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  warmup_steps: 50
  warmdown_ratio: 0.5
  final_lr_frac: 0.05
  eval_every: 250
  eval_batches: 8
  save_every: 250
  log_every: 10
  mfu_peak_flops_per_second: 35580000000000
  mfu_peak_flops_basis: NVIDIA GeForce RTX 3090 advertised FP32 peak (35.58 TFLOP/s)
  dtype: float32
  compile: false
  compile_backend: inductor
  compile_mode: default
  compile_fallback_policy: eager
  compile_fullgraph: false
  compile_dynamic: false
  activation_checkpointing: false

generation:
  temperature: 0.8
  top_k: 50
  top_p: null
  max_new_tokens: 256
  seed: null

web:
  enabled: false
