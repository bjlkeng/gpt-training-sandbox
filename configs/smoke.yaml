run:
  name: smoke
  seed: 1337
  device: cpu
  output_dir: runs

tracking:
  wandb:
    enabled: false
    project: gpt-training-sandbox
    entity: null
    mode: online
    log_code: false
    log_model_artifacts: false
    log_dataset_artifacts: false
    log_tokenizer_artifacts: false
    log_prompts: false
    log_responses: false

data:
  profile: tiny_text
  base_dir: data

tokenizer:
  type: byte
  vocab_size: 265
  max_chars: 100000
  doc_cap: 10000

model:
  profile: simple_gpt
  vocab_size: 265
  seq_len: 128
  n_layer: 2
  n_head: 2
  n_kv_head: 2
  sliding_window_pattern: L
  sliding_window_size: 64
  use_value_embeddings: false
  value_embedding_gate_channels: 12
  n_embd: 128
  mlp_ratio: 4
  dropout: 0.0
  bias: false
  tie_weights: true
  norm: layernorm
  activation: gelu
  use_rope: false
  rope_theta: 10000.0
  use_rmsnorm: false
  use_qk_norm: false
  use_gqa: false
  attention_backend: manual
  attention_fallback_policy: allow
  flash_attention_provider: auto
  use_flash_attention: false
  use_kv_cache: false

train:
  device_batch_size: 2
  total_batch_size_tokens: 1024
  grad_accum_steps: auto
  max_steps: 200
  learning_rate: 0.005
  weight_decay: 0.0
  warmup_steps: 5
  warmdown_ratio: 0.2
  eval_every: 10
  eval_tokens: 4096
  sample_every: 25
  save_every: 25
  log_every: 1
  dtype: float32
  compile: false
  compile_backend: inductor
  compile_mode: default
  compile_fallback_policy: eager
  compile_fullgraph: false
  compile_dynamic: false
  activation_checkpointing: false

generation:
  temperature: 0.4
  top_k: 20
  top_p: null
  max_new_tokens: 100
  seed: 1337

web:
  enabled: false
